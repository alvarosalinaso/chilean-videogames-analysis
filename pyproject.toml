[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chilean_videogames"
version = "0.1.0"
authors = [
  { name = "Alvaro Salinas Ortiz", email = "alvaro@example.com" },
]
description = "Análisis de videojuegos desarrollados en Chile"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "plotly>=5.19.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "matplotlib>=3.8.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "great_tables>=0.10.0",
    "altair>=5.3.0",
    "seaborn>=0.13.0",
    "networkx>=3.2",
    "scikit-learn>=1.4.0",
    "statsmodels>=0.14.0",
    "dash>=2.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]

[project.urls]
"Homepage" = "https://github.com/alvarosalinaso/chilean-videogames-analysis"
"Bug Tracker" = "https://github.com/alvarosalinaso/chilean-videogames-analysis/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=chilean_videogames --cov-report=term-missing --cov-report=xml --cov-fail-under=65"
testpaths = ["tests"]